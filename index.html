<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nosso Cantinho ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffeef4;
      color: #333;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #e75480;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #777;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #e75480;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      color: #d33;
      text-align: center;
      margin-top: 12px;
    }

    #chat {
      display: none;
      height: 100vh;
      flex-direction: column;
      padding: 15px;
    }

    .chat-header {
      text-align: center;
      color: #e75480;
      font-size: 22px;
      font-weight: bold;
      padding: 10px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #e75480;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .other {
      align-self: flex-start;
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .send-area {
      display: flex;
      gap: 8px;
      padding: 10px 0;
    }

    #messageInput {
      flex: 1;
      margin: 0;
    }

    #sendButton {
      width: auto;
      margin: 0;
      padding: 0 20px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="screen" id="login">
    <div class="box">

      <h1>Nosso Cantinho ❤️</h1>

      <p class="subtitle">
        Nosso cantinho especial.
      </p>

      <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
      >

      <input
        type="password"
        id="password"
        placeholder="Sua senha"
      >

      <button onclick="login()">
        Entrar
      </button>

      <div class="error" id="error"></div>

    </div>
  </div>


  <!-- CHAT -->
  <div id="chat">

    <div class="chat-header">
      Nosso Cantinho ❤️
    </div>

    <div id="messages"></div>

    <div class="send-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Digite uma mensagem..."
      >

      <button id="sendButton" onclick="sendMessage()">
        Enviar
      </button>

    </div>

  </div>


  <!-- NOVA SENHA -->
  <div class="screen" id="resetPassword" style="display:none;">

    <div class="box">

      <h1>Nova senha 🔒</h1>

      <p class="subtitle">
        Digite sua nova senha abaixo.
      </p>

      <input
        type="password"
        id="newPassword"
        placeholder="Nova senha"
      >

      <button onclick="updatePassword()">
        Redefinir senha
      </button>

      <div class="error" id="resetError"></div>

    </div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL = "https://bdkhcowgukgrxwlbcepm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QiyxMPTL-kpmkbjgouaskw_jDflGGgI";


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    let currentUser = null;
let messagesChannel = null;

    /* =========================
       RECUPERAÇÃO DE SENHA
    ========================= */

    supabaseClient.auth.onAuthStateChange((event, session) => {

      if (event === "PASSWORD_RECOVERY") {

        document.getElementById("login").style.display = "none";

        document.getElementById("chat").style.display = "none";

        document.getElementById("resetPassword").style.display = "flex";

      }

    });


    async function updatePassword() {

      const newPassword =
        document.getElementById("newPassword").value;

      const resetError =
        document.getElementById("resetError");

      resetError.textContent = "";


      if (newPassword.length < 6) {

        resetError.textContent =
          "A senha precisa ter pelo menos 6 caracteres.";

        return;

      }


      const { error } =
        await supabaseClient.auth.updateUser({

          password: newPassword

        });


      if (error) {

        resetError.textContent =
          error.message;

        return;

      }


      resetError.style.color = "green";

      resetError.textContent =
        "Senha alterada com sucesso!";

    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      error.textContent = "";


      if (!email || !password) {

        error.textContent =
          "Digite seu e-mail e sua senha.";

        return;

      }


      const { data, error: loginError } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (loginError) {

        error.textContent =
          loginError.message;

        return;

      }


      currentUser = data.user;


      document.getElementById("login").style.display =
        "none";


      document.getElementById("chat").style.display =
        "flex";


      loadMessages();

      subscribeToMessages();

    }


    /* =========================
       CARREGAR MENSAGENS
    ========================= */

    async function loadMessages() {

      const { data, error } =
        await supabaseClient
          .from("messages")
          .select("*")
          .order("created_at", {
            ascending: true
          });


      if (error) {

        console.log(error);

        return;

      }


      const messages =
        document.getElementById("messages");


      messages.innerHTML = "";


      data.forEach(message => {

        showMessage(message);

      });

    }


    /* =========================
       MOSTRAR MENSAGEM
    ========================= */

    function showMessage(message) {

      const messages =
        document.getElementById("messages");


      const div =
        document.createElement("div");


      div.classList.add("message");


      if (
        currentUser &&
        message.user_id === currentUser.id
      ) {

        div.classList.add("mine");

      } else {

        div.classList.add("other");

      }


      div.textContent = message.content;


      messages.appendChild(div);


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       ENVIAR MENSAGEM
    ========================= */

    async function sendMessage() {

      const input =
        document.getElementById("messageInput");


      const content =
        input.value.trim();


      if (!content) return;


      if (!currentUser) {

        alert("Você não está conectado.");

        return;

      }


      const { error } =
        await supabaseClient
          .from("messages")
          .insert({

            user_id: currentUser.id,

            content: content

          });


      if (error) {

  alert(error.message);

  console.log(error);

  return;

}


input.value = "";

    }


    /* =========================
       ENTER PARA ENVIAR
    ========================= */

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      });


    /* =========================
       MENSAGENS EM TEMPO REAL
    ========================= */

    function subscribeToMessages() {


  if (messagesChannel) {
    supabaseClient.removeChannel(messagesChannel);
  }

  messagesChannel = supabaseClient
    .channel("messages-channel")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      payload => {
        showMessage(payload.new);
      }
    )
    .subscribe();
}

  </script>

</body>
</html>
