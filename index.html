<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Cantinho ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7eef3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    .login {
      padding: 35px 25px;
      margin: auto;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #d85b8a;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #d85b8a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .chat {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .header {
      background: #d85b8a;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #fff8fb;
    }

    .message {
      background: #f0d6e1;
      padding: 10px 13px;
      border-radius: 15px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.mine {
      margin-left: auto;
      background: #d85b8a;
      color: white;
    }

    .time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .send {
      display: flex;
      padding: 10px;
      border-top: 1px solid #eee;
      background: white;
    }

    .send input {
      margin: 0;
      flex: 1;
      margin-right: 8px;
    }

    .send button {
      width: auto;
      margin: 0;
      padding: 0 18px;
    }

    .error {
      color: #c0392b;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="login" id="login">
    <h1>Nosso Cantinho ❤️</h1>
    <p class="subtitle">Um lugar só nosso.</p>

    <input type="email" id="email" placeholder="Seu e-mail">
    <input type="password" id="password" placeholder="Sua senha">

    <button onclick="login()">Entrar</button>

    <div class="error" id="error"></div>
  </div>

  <div class="chat" id="chat">

    <div class="header">
      Nosso Cantinho ❤️
    </div>

    <div class="messages" id="messages"></div>

    <div class="send">
      <input
        type="text"
        id="messageInput"
        placeholder="Escreva uma mensagem..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">Enviar</button>
    </div>

  </div>

</div>

  <div class="login" id="resetPassword" style="display:none;">
    <h1>Nova senha 🔒</h1>
    <p class="subtitle">Digite sua nova senha abaixo.</p>

    <input type="password" id="newPassword" placeholder="Nova senha">

    <button onclick="updatePassword()">Redefinir senha</button>

    <div class="error" id="resetError"></div>
  </div>  
  
<script>

  // COLOQUE AQUI AS INFORMAÇÕES DO SEU PROJETO SUPABASE
  const SUPABASE_URL = "https://bdkhcowgukgrxwlbcepm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QiyxMPTL-kpmkbjgouaskw_jDflGGgI";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentUser = null;

  supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "none";
    document.getElementById("resetPassword").style.display = "block";
  }
});
  
  async function updatePassword() {

    const newPassword = document.getElementById("newPassword").value;
    const resetError = document.getElementById("resetError");

    resetError.textContent = "";

    if (newPassword.length < 6) {
      resetError.textContent = "A senha precisa ter pelo menos 6 caracteres.";
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({
      password: newPassword
    });

    if (error) {
      resetError.textContent = "Não foi possível alterar a senha.";
      return;
    }

    resetError.style.color = "green";
    resetError.textContent = "Senha alterada com sucesso!";

  }
  
  async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const error = document.getElementById("error");

    error.textContent = "";

    const { data, error: loginError } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (loginError) {
      error.textContent = loginError.message;
      return;
    }

    currentUser = data.user;

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";

    loadMessages();
    subscribeToMessages();
  }

  async function loadMessages() {

    const { data, error } = await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", { ascending: true });

    if (error) {
      console.log(error);
      return;
    }

    const messages = document.getElementById("messages");
    messages.innerHTML = "";

    data.forEach(message => {
      showMessage(message);
    });
  }

  function showMessage(message) {

    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.className =
      "message " +
      (message.user_id === currentUser.id ? "mine" : "");

    const text = document.createElement("div");
    text.textContent = message.content;

    const time = document.createElement("div");
    time.className = "time";

    time.textContent =
      new Date(message.created_at).toLocaleTimeString(
        "pt-BR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    div.appendChild(text);
    div.appendChild(time);

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage() {

    const input = document.getElementById("messageInput");
    const content = input.value.trim();

    if (!content) return;

    const { error } = await supabaseClient
      .from("messages")
      .insert({
        user_id: currentUser.id,
        content: content
      });

    if (error) {
      console.log(error);
      return;
    }

    input.value = "";
  }

  function subscribeToMessages() {

    supabaseClient
      .channel("messages-channel")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          if (payload.new.user_id !== currentUser.id) {
            showMessage(payload.new);
          }

        }
      )
      .subscribe();
  }

</script>

</body>
</html>
